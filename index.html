<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
    .container {
        text-align: center;
    }
    h1 {
        font-size: 4rem;
        margin: 0;
    }
    p {
        color: #666;
    }
</style>
</head>
<body>
    <div class="container">
        <h1 id="code">0000</h1>
        <p>Today's Password</p>
    </div>
<script>
    const today = new Date().toISOString().split('T')[0];
    const savedDate = localStorage.getItem('passwordDate');
    let savedCode = localStorage.getItem('passwordCode');
    if (savedDate !== today || !savedCode) {
        savedCode = Math.floor(Math.random() * 10000)
            .toString()
            .padStart(4, '0');
        localStorage.setItem('passwordDate', today);
        localStorage.setItem('passwordCode', savedCode);
    }
    document.getElementById('code').textContent = savedCode;
</script>
</body>
</html>
