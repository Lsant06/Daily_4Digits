<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 5rem;
            margin: 0 0 20px 0;
        }
        button {
            font-size: 1.2rem;
            padding: 12px 30px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:active {
            background: #005ecb;
        }
        .history {
            margin-top: 30px;
            text-align: left;
        }
        .history h2 {
            font-size: 1rem;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .history ol {
            padding-left: 20px;
            color: #444;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="code">----</h1>
        <button onclick="generateCode()">Generate Code</button>
        <div class="history">
            <h2>Last 10 Codes</h2>
            <ol id="historyList"></ol>
        </div>
    </div>
    <script>
        let history = JSON.parse(localStorage.getItem('codeHistory') || '[]');

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            history.forEach(code => {
                const li = document.createElement('li');
                li.textContent = code;
                list.appendChild(li);
            });
        }

        function generateCode() {
            const code = Math.floor(Math.random() * 10000)
                .toString()
                .padStart(4, '0');
            document.getElementById('code').textContent = code;
            history.unshift(code);
            if (history.length > 10) history.pop();
            localStorage.setItem('codeHistory', JSON.stringify(history));
            renderHistory();
        }

        renderHistory();
    </script>
</body>
</html>
